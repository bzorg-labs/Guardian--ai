[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-ai"
version = "0.1.0"
description = "Lightweight Python static analysis for detecting incomplete return paths."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
guardian = "code_guardian:main"

[tool.setuptools]
py-modules = ["code_guardian"]
